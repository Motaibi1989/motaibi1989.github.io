<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>EmailJS Contact Form | Mohammed Alotaibi</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="assets/css/master.css" rel="stylesheet"/></head><body><div data-include="header.html"></div><div data-include="nav.html"></div><main><section class="section"><div class="container"><div class="section-title"><h2>EmailJS Contact Form</h2></div><!-- Add this script before </body> -->
<div data-include="footer.html"></div><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" type="text/javascript">
</script>
<!-- Updated form -->
<div class="contact-form fade-in delay-1">
<form id="contactForm">
<div class="form-group">
<label for="name">Name</label>
<input id="name" name="name" required="" type="text"/>
</div>
<div class="form-group">
<label for="email">Email</label>
<input id="email" name="email" required="" type="email"/>
</div>
<div class="form-group">
<label for="message">Message</label>
<textarea id="message" name="message" required=""></textarea>
</div>
<button class="btn" type="submit">Send Message</button>
</form>
</div>
<script>
    (function() {
        emailjs.init("YOUR_PUBLIC_KEY"); // Get from emailjs.com
    })();
    
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        emailjs.send('service_id', 'template_id', {
            from_name: document.getElementById('name').value,
            from_email: document.getElementById('email').value,
            message: document.getElementById('message').value
        }).then(() => alert('Message sent!'));
    });
</script></div></section></main><button aria-label="Scroll to top" class="scroll-top" id="scrollTop" type="button"><i class="fas fa-arrow-up"></i></button><script src="assets/js/include.js"></script><script src="assets/js/main.js"></script></body></html>
